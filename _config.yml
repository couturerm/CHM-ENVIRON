# GitHub Pages / Jekyll — CHM-4152
#
# Ce dépôt est un site statique pur : Jekyll ne sert qu'à contrôler CE QUI EST PUBLIÉ.
# Les dossiers préfixés par « _ » ne sont jamais publiés par Jekyll ; `exclude` les
# verrouille explicitement, au cas où ce comportement changerait.
#
# La banque de questions ne vit plus dans le dépôt : elle est sur le disque du
# professeur (hors git). Le dépôt ne contient que les quiz formatifs consommés
# par les pages de module (data/*.quiz.json). Les entrées ci-dessous restent
# comme filet de sécurité si un dossier d'auteur réapparaissait localement.

exclude:
  - _authoring/
  - banque-examen/
  - banque-questions/
  - tools/
  - "*.md"
  - .vscode/

# Aucun traitement Liquid/Markdown attendu : le site est en HTML brut.
plugins: []
